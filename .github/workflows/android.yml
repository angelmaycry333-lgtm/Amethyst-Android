name: ColaLauncher Android CI

on:
  push:
    branches:
      - cola-launcher-branding
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-22.04
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Get JRE 8
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: '9.6.1'

      - name: Build Debug APK
        run: |
          gradle :app_pojavlauncher:assembleDebug
          mkdir -p out
          cp app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/ColaLauncher-debug.apk
          md5sum out/ColaLauncher-debug.apk > out/ColaLauncher-debug.md5

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ColaLauncher-debug
          path: out/ColaLauncher-debug.*
